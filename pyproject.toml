[project]
name = "age-estimator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JellyFishJuggler", email = "guptasrijan85@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=4.10,<5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "tqdm>=4.70.1",
]

[tool.uv.build-backend]
module-root = "src"
source-exclude = ["src/age_estimator/data/**"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[project.scripts]
age-estimator = "age_estimator:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
